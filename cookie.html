<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Cookie Clicker</title>
    <link rel="styleSheet" type="text/css" href="cookie.css">
    <script src="cookie.js"></script>
</head>

<body>
    <table>
        <tr>
            <th colspan="3">Cookie Clicker</th>
        </tr>
        <tr>
            <td id="cookiesPerSecond">Cookies per Second: 0</td>
            <td id="cookieAmount">Cookie Amount: 0</td>
            <td class="upgrades">
                <span id="upgrade1Cost">Cost: 50 &emsp;</span>
                <button class="upgradeButton" id="upgrade1" onclick="upgrade1()"
                    title="Increases the amount of cookies made per click">Click+</button>
            </td>
        </tr>
        <tr>
            <td id="clickAmount">Cookies per Click: 1</td>
            <td>
                <button id="cookie" onclick="clickCookie()">
                    <img src="cookie.jpg" alt="cookie">
                </button>
            </td>
            <td class="upgrades">
                <span id="upgrade2Cost">Cost: 500 &emsp;</span>
                <button class="upgradeButton" id="upgrade2" onclick="upgrade2()"
                    title="Increases cookies per second by 10">Bakery</button>
            </td>
        </tr>
        <tr>
            <td></td>
            <td></td>
            <td class="upgrades">
                <span id="upgrade3Cost">Cost: 2500 &emsp;</span>
                <button class="upgradeButton" id="upgrade3" onclick="upgrade3()"
                    title="Increases cookies per second by 30">Factory</button>
            </td>
        </tr>
    </table>
</body>

</html>
