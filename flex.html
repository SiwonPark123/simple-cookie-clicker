<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Cookie Clicker</title>
    <link rel="styleSheet" type="text/css" href="flex.css">
</head>

<body>
    <div class="container" id="column1">
        <div class="top">Cookies: 0</div>
        <div>Cookies Per Click: 1</div>
        <div>Cookies Per Sec: 0</div>
        <button id="cookie">
            <img src="cookie.png" alt="cookie" draggable="false">
        </button>
    </div>
    <div class="container">
        <div id="title">Cookie Clicker</div>
        <button id="save">Save</button>
        <button id="reset">Reset</button>
    </div>
    <div class="container">
        <div class="top">Upgrades</div>
        <button>Upgrade 1</button>
        <button>Upgrade 2</button>
        <button>Upgrade 3</button>
        <button>Upgrade 4</button>
        <button>Upgrade 5</button>

    </div>
</body>

</html>
