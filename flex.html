<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Cookie Clicker</title>
    <link rel="styleSheet" type="text/css" href="flex.css">
</head>

<body>
    <div class="container" id="column1">
        <div class="title"></div>
        <div id="cookies">Cookies: 0</div>
        <div id="cpc">Cookies Per Click: 1</div>
        <div id="cps">Cookies Per Sec: 0</div>
        <button id="cookie" onclick="clickCookie()">
            <img src="cookie.png" alt="cookie" draggable="false">
        </button>
    </div>
    <div class="container">
        <div class="title">Cookie Clicker</div>
        <button id="save">Save</button>
        <button id="reset">Reset</button>
    </div>
    <div class="container" id="column3">
        <div class="title"></div>
        <div>Upgrades</div>
        <div class="upgrades">
            <span id="upgrade1Cost">Cost: 10</span>
            <button class="upgradeButton" id="upgrade1" onclick="upgrade1()">Click+</button>
        </div>
        <div class="upgrades">
            <span>Cost: 100</span>
            <button class="upgradeButton" id="upgrade2">Oven</button>
        </div>
        <div class="upgrades">
            <span>Cost: 1000</span>
            <button class="upgradeButton" id="upgrade3">Bakery</button>
        </div>
        <div class="upgrades">
            <span>Cost: 15000</span>
            <button class="upgradeButton" id="upgrade4">Factory</button>
        </div>
        <div class="upgrades">
            <span>Cost: 100000</span>
            <button class="upgradeButton" id="upgrade5">Company</button>
        </div>

    </div>
    <script src="flex.js"></script>
</body>

</html>
