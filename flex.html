<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Cookie Clicker</title>
    <link rel="styleSheet" type="text/css" href="flex.css">
</head>

<body>
    <div class="container" id="column1">
        <div class="title"></div>
        <div>Cookies: 0</div>
        <div>Cookies Per Click: 1</div>
        <div>Cookies Per Sec: 0</div>
        <button id="cookie">
            <img src="cookie.png" alt="cookie" draggable="false">
        </button>
    </div>
    <div class="container">
        <div class="title">Cookie Clicker</div>
        <button id="save">Save</button>
        <button id="reset">Reset</button>
    </div>
    <div class="container" id="column3">
        <div class="title"></div>
        <div>Upgrades</div>
        <button class="upgradeButton">Click+</button>
        <button class="upgradeButton">Oven</button>
        <button class="upgradeButton">Bakery</button>
        <button class="upgradeButton">Factory</button>
        <button class="upgradeButton">Company</button>

    </div>
</body>

</html>
